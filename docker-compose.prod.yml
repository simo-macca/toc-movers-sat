# Production-style stack: static frontend on nginx, backend without reload.
# The frontend proxies /api to the backend, so only port 3000 is needed.
# Usage: docker compose -f docker-compose.prod.yml up --build -d
services:
  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=["http://localhost:3000"]
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
